# PATAS — Private LAN pilot Docker Compose (HTTP only)
# Usage: docker compose -f infra/docker-compose.yml up -d
services:
  db:
    image: postgres:16-alpine
    container_name: patas_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: patas
      POSTGRES_USER: patas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patas -d patas"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: patas_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ../backend
      dockerfile: ../backend/Dockerfile
    image: patas-backend:pilot
    container_name: patas_migrate
    restart: "no"
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql://patas:${POSTGRES_PASSWORD}@db:5432/patas
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY required}
      APP_ENV: production
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: patas-backend:pilot
    container_name: patas_backend
    restart: unless-stopped
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*"]
    environment:
      DATABASE_URL: postgresql://patas:${POSTGRES_PASSWORD}@db:5432/patas
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY required}
      APP_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_REQUEST_TIMEOUT_SECONDS: ${WHATSAPP_REQUEST_TIMEOUT_SECONDS:-10}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: patas_frontend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: patas_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  db_data:
  redis_data:
