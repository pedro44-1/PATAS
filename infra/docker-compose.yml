# PATAS — Production Docker Compose
# Usage: docker compose -f infra/docker-compose.yml up -d
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: patas_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: patas
      POSTGRES_USER: patas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patas -d patas"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: patas_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: ../backend/Dockerfile
    container_name: patas_backend
    restart: unless-stopped
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://patas:${POSTGRES_PASSWORD}@db:5432/patas
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY required}
      APP_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-https://patas.ao}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ../frontend
      dockerfile: ../frontend/Dockerfile
    container_name: patas_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-https://patas.ao/api}

  nginx:
    image: nginx:alpine
    container_name: patas_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
      - ./nginx/nginx-ssl.conf:/etc/nginx/nginx-ssl.conf:ro
    depends_on:
      - backend
      - frontend

  certbot:
    image: certbot/certbot:latest
    container_name: patas_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM; while :; do sleep 12h & wait $$!; certbot renew; done"
    environment:
      - TERM=xterm

volumes:
  db_data:
  redis_data:
  certbot_www:
  certbot_conf:
