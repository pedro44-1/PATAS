# PATAS — local development overrides for the LAN pilot stack
# Usage: docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml up -d

services:
  db:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  migrate:
    environment:
      APP_ENV: development
    volumes:
      - ../backend:/app

  backend:
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--proxy-headers", "--forwarded-allow-ips=*"]
    environment:
      APP_ENV: development
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app

  frontend:
    ports:
      - "3000:80"
