name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-unit:
    name: Backend · SQLite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run fast suite
        run: PYTHONPATH=. pytest tests/ -q

  backend-integration:
    name: Backend · PostgreSQL and Redis
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: patas_test
          POSTGRES_USER: patas
          POSTGRES_PASSWORD: patas_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://patas:patas_test@localhost:5432/patas_test
      POSTGRES_ADMIN_URL: postgresql://patas:patas_test@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-for-ci
      ENCRYPTION_KEY: test-encryption-key-for-ci
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrate and run real integration suite
        run: |
          PYTHONPATH=. alembic upgrade head
          PYTHONPATH=. uvicorn src.main:app --host 127.0.0.1 --port 8000 > /tmp/patas-api.log 2>&1 &
          api_pid=$!
          trap 'kill $api_pid || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8000/health && break
            if [ "$attempt" -eq 30 ]; then cat /tmp/patas-api.log; exit 1; fi
            sleep 1
          done
          BASE_URL=http://127.0.0.1:8000 PYTHONPATH=. pytest \
            tests/test_integration.py tests/test_postgres_migrations.py \
            -m integration -q --tb=short

  frontend:
    name: Frontend · tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build --workspace=@patas/shared-types
      - run: npm run test --workspace=frontend
      - run: npm run build

  lint:
    name: Lint · Ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src/

  compose-smoke:
    name: LAN Compose · smoke
    runs-on: ubuntu-latest
    needs: [backend-unit, backend-integration, frontend, lint]
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify clean LAN installation
        run: |
          trap 'docker compose -f infra/docker-compose.yml --env-file infra/.env.example down --volumes --remove-orphans' EXIT
          docker compose -f infra/docker-compose.yml --env-file infra/.env.example config --quiet
          docker compose -f infra/docker-compose.yml --env-file infra/.env.example up -d --build
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1/health && break
            if [ "$attempt" -eq 60 ]; then docker compose -f infra/docker-compose.yml --env-file infra/.env.example logs; exit 1; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1/ > /dev/null
